<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Houseplant Haven - Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="form-page">
    <h1 class="intro-title">Contact Form</h1>

    <form action="#" method="post" class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="e.g., Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="e.g., jane.doe@email.com" required>
      </div>

      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="7"></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer class="footer">
    <p>This is a small site project created for practice purposes.</p>
  </footer>

</body>
</html>
