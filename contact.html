<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Houseplant Haven - Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 class="intro-title">Contact Form</h1>
    <form> 
      <label for="name">Name</label> 
      <input type="text" id="name" name="name" placeholder="Enter Your Name (e.g., John Doe)" required> 
      <br><br>
      <label for="email">Email</label> 
      <input type="email" id="email" name="email" placeholder="Enter Your Email (e.g., john.doe@example.com)" required> 
      <br><br>
      <label for="comments">Comments</label> 
      <textarea id="comments" name="comments" cols="20" rows="5" placeholder="Share Your Comments Here..."></textarea> 
      <br><br>
      <button type="submit">Submit</button> 
    </form>
  </main>
  <footer> 
      <p>This is a small site project created for practice purposes.</p> 
  </footer>
</body>
</html>
